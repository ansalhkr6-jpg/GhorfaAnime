```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#b747dc">

  <meta name="description"
        content="غرفة الأنمي - منصة لمتابعة الأنمي">

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">

  <title>غرفة الأنمي</title>
</head>

<body>

<header class="topbar">

  <button class="icon"
          onclick="showMessage('القائمة')">
    ☰
  </button>

  <h1>
    غرفة <span>الأنمي</span>
  </h1>

  <button class="premium"
          onclick="showMessage('الاشتراك المميز')">
    ♛
  </button>

</header>


<main>

  <!-- البحث -->

  <div class="search">

    <span>⌕</span>

    <input
      id="searchInput"
      type="search"
      placeholder="ابحث عن أنمي..."
      autocomplete="off">

  </div>


  <!-- الواجهة الرئيسية -->

  <section class="hero">

    <div class="hero-content">

      <small>مرحبًا بك في غرفة الأنمي</small>

      <h2>اكتشف عالم الأنمي</h2>

      <p>
        شاهد وتابع أنمياتك المفضلة
      </p>

      <button onclick="scrollToAnime()">
        ▶ شاهد الآن
      </button>

    </div>

  </section>


  <!-- الاختصارات -->

  <div class="quick">

    <button onclick="showSection('popular')">
      <span>🔥</span>
      <b>الأكثر مشاهدة</b>
    </button>

    <button onclick="showSection('new')">
      <span>✨</span>
      <b>الأنميات الجديدة</b>
    </button>

    <button onclick="continueWatching()">
      <span>▶</span>
      <b>أكمل المشاهدة</b>
    </button>

    <button onclick="showSection('categories')">
      <span>▦</span>
      <b>التصنيفات</b>
    </button>

  </div>


  <!-- المشغل -->

  <section id="playerSection"
           class="player-section hidden">

    <div class="player-header">

      <button onclick="closePlayer()">
        ✕
      </button>

      <div>

        <small id="playerAnime">
          غرفة الأنمي
        </small>

        <h2 id="playerTitle">
          اختر حلقة
        </h2>

      </div>

    </div>


    <div id="videoPlayer"
         class="video-player">

      <div class="player-placeholder">
        اختر حلقة للمشاهدة
      </div>

    </div>


    <div class="player-note">
      يتم تشغيل الفيديو من المصدر الخارجي الرسمي.
    </div>


    <div id="serverContainer"
         class="servers">
    </div>

  </section>


  <!-- الأكثر مشاهدة -->

  <section id="popular">

    <div class="section-header">

      <h2>الأكثر مشاهدة</h2>

      <span>عرض الكل</span>

    </div>

    <div id="animeGrid"
         class="anime-grid">

      <!-- يتم ملؤه بواسطة JavaScript -->

    </div>

  </section>


  <!-- الأنميات الجديدة -->

  <section id="new">

    <div class="section-header">

      <h2>الأنميات الجديدة</h2>

      <span>عرض الكل</span>

    </div>

    <div id="newGrid"
         class="anime-grid">

      <!-- يتم ملؤه بواسطة JavaScript -->

    </div>

  </section>


  <!-- التصنيفات -->

  <section id="categories">

    <div class="section-header">

      <h2>التصنيفات</h2>

    </div>

    <div class="categories">

      <button onclick="filterCategory('أكشن')">
        ⚔ أكشن
      </button>

      <button onclick="filterCategory('فانتازيا')">
        ✨ فانتازيا
      </button>

      <button onclick="filterCategory('مدرسي')">
        🎒 مدرسي
      </button>

      <button onclick="filterCategory('غموض')">
        🌑 غموض
      </button>

    </div>

  </section>


  <!-- قائمتي -->

  <section id="myListSection"
           class="my-list-section">

    <div class="section-header">

      <h2>قائمتي ♡</h2>

    </div>

    <div id="myListGrid"
         class="anime-grid">

    </div>

  </section>

</main>


<!-- القائمة السفلية -->

<nav class="bottom-nav">

  <button class="active"
          onclick="goHome()">

    <span>⌂</span>
    <small>الرئيسية</small>

  </button>


  <button onclick="focusSearch()">

    <span>⌕</span>
    <small>بحث</small>

  </button>


  <button onclick="showMyList()">

    <span>♡</span>
    <small>قائمتي</small>

  </button>


  <button onclick="showMessage('الحساب')">

    <span>♙</span>
    <small>حسابي</small>

  </button>

</nav>


<div id="message"
     class="message">
</div>


<script src="script.js"></script>

</body>
</html>
```
